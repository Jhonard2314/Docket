<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents — Docket</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="documents">
  <div id="app" class="d-flex">

    <main class="main-content flex-grow-1">
      <div class="topbar">
        <h1>Documents</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
          <i class="bi bi-upload me-1"></i> Upload
        </button>
      </div>

      <!-- Search & filter bar -->
      <div class="bg-white rounded-3 shadow-sm p-3 mb-3">
        <form id="search-form" class="row g-2 align-items-end">
          <div class="col-sm-6">
            <label class="form-label small fw-semibold mb-1">Search by filename</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="search-input" type="text" class="form-control" placeholder="e.g. report_2026" />
            </div>
          </div>
          <div class="col-sm-4">
            <label class="form-label small fw-semibold mb-1">Category</label>
            <select id="filter-category" class="form-select">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="col-sm-2">
            <button class="btn btn-outline-primary w-100" type="submit">Search</button>
          </div>
        </form>
      </div>

      <!-- Documents table -->
      <div class="doc-table-wrapper">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Filename</th><th>Category</th><th>Uploaded By</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="docs-tbody">
            <tr><td colspan="5" class="text-center text-muted py-4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Upload Modal -->
  <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="uploadModalLabel"><i class="bi bi-upload me-1"></i>Upload Document</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="upload-form" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label fw-semibold">Select Category</label>
              <select id="upload-category" class="form-select" required>
                <option value="">Loading…</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">File</label>
              <div class="upload-zone" id="upload-zone" onclick="document.getElementById('upload-file').click()">
                <div class="upload-icon"><i class="bi bi-cloud-upload"></i></div>
                <p class="mt-2 mb-0">Click to browse or drag &amp; drop</p>
                <p class="text-muted small">PDF, Word, JPG, PNG — max 10 MB</p>
              </div>
              <input type="file" id="upload-file" class="d-none"
                     accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif" />
              <div id="file-name-display" class="mt-2 small text-muted"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Upload</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { injectSidebar } from '../js/sidebar.js';
    import '../js/logout.js';
    injectSidebar();

    // Show selected filename
    document.getElementById('upload-file').addEventListener('change', (e) => {
      const name = e.target.files[0]?.name || '';
      document.getElementById('file-name-display').textContent = name ? `Selected: ${name}` : '';
    });

    // Drag-and-drop
    const zone = document.getElementById('upload-zone');
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) {
        const dt = new DataTransfer();
        dt.items.add(f);
        document.getElementById('upload-file').files = dt.files;
        document.getElementById('file-name-display').textContent = `Selected: ${f.name}`;
      }
    });
  </script>
  <script type="module" src="../js/documents.js"></script>
</body>
</html>
