<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents — Docket</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="documents">
<div id="app">
  <!-- sidebar injected here -->

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Documents</h1>
        <p class="page-subtitle">Upload, organize, and manage your files</p>
      </div>
      <button class="btn-primary" id="open-upload-btn">
        <i class="bi bi-upload"></i> Upload File
      </button>
    </div>

    <!-- Search & filter -->
    <div class="search-panel">
      <form id="search-form" class="search-row">
        <div class="search-input-wrap">
          <i class="bi bi-search search-icon"></i>
          <input id="search-input" type="text" class="search-input" placeholder="Search by filename…" />
        </div>
        <select id="filter-category" class="filter-select">
          <option value="">All Categories</option>
        </select>
        <button type="submit" class="btn-primary">Search</button>
      </form>
    </div>

    <!-- Documents table -->
    <div class="panel">
      <div class="panel-header">
        <span><i class="bi bi-file-earmark-text me-2"></i>All Documents</span>
        <span class="doc-count" id="doc-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Filename</th>
              <th>Category</th>
              <th>Uploaded By</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="docs-tbody">
            <tr><td colspan="5"><div class="empty-state"><i class="bi bi-hourglass-split"></i><p>Loading…</p></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Upload Modal -->
<div class="modal-overlay" id="upload-modal" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <span><i class="bi bi-upload me-2"></i>Upload Document</span>
      <button class="modal-close" id="close-upload-btn"><i class="bi bi-x-lg"></i></button>
    </div>
    <form id="upload-form" enctype="multipart/form-data">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="upload-category" class="form-select" required>
          <option value="">Select category…</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">File</label>
        <div class="upload-zone" id="upload-zone">
          <div class="upload-icon"><i class="bi bi-cloud-upload"></i></div>
          <p class="upload-text">Click to browse or drag &amp; drop</p>
          <p class="upload-hint">PDF, Word, JPG, PNG — max 10 MB</p>
        </div>
        <input type="file" id="upload-file" style="display:none"
               accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif" />
        <div id="file-name-display" class="file-name-display"></div>
      </div>
      <button type="submit" class="btn-primary w-full" id="upload-submit-btn">
        <i class="bi bi-upload"></i> Upload
      </button>
    </form>
  </div>
</div>

<script type="module">
  import { injectSidebar } from '../js/sidebar.js';
  import '../js/logout.js';
  injectSidebar();

  // Modal open/close
  document.getElementById('open-upload-btn').addEventListener('click', () => {
    document.getElementById('upload-modal').style.display = 'flex';
  });
  document.getElementById('close-upload-btn').addEventListener('click', () => {
    document.getElementById('upload-modal').style.display = 'none';
  });
  document.getElementById('upload-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.style.display = 'none';
  });

  // Upload zone click
  document.getElementById('upload-zone').addEventListener('click', () => {
    document.getElementById('upload-file').click();
  });

  // Show selected filename
  document.getElementById('upload-file').addEventListener('change', (e) => {
    const name = e.target.files[0]?.name || '';
    const display = document.getElementById('file-name-display');
    display.textContent = name ? '📎 ' + name : '';
  });

  // Drag and drop
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover',  (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()  => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) {
      const dt = new DataTransfer();
      dt.items.add(f);
      document.getElementById('upload-file').files = dt.files;
      document.getElementById('file-name-display').textContent = '📎 ' + f.name;
    }
  });
</script>
<script type="module" src="../js/documents.js"></script>
</body>
</html>
