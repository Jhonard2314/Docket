<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Docket</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand"><i class="bi bi-folder2-open me-1"></i>Docket</div>
        <p class="text-muted mt-1 mb-0">Document Management System</p>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>
        <button id="login-btn" type="submit" class="btn btn-primary w-100">Log In</button>
      </form>

      <p class="text-center mt-3 mb-0 text-muted small">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
