<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — Docket</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="categories">
<div id="app">
  <!-- sidebar injected here -->

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Categories</h1>
        <p class="page-subtitle">Organize documents into groups</p>
      </div>
    </div>

    <div class="two-col-layout">
      <!-- Add category form (admin only) -->
      <div class="panel admin-panel" id="add-cat-panel" style="display:none">
        <div class="panel-header"><span><i class="bi bi-plus-circle me-2"></i>Add Category</span></div>
        <div class="panel-body">
          <form id="add-category-form">
            <div class="form-group">
              <label class="form-label">Category Name</label>
              <input id="category-name" type="text" class="form-input" placeholder="e.g. Finance" required />
            </div>
            <button type="submit" class="btn-primary w-full">
              <i class="bi bi-plus-lg"></i> Add Category
            </button>
          </form>
        </div>
      </div>

      <!-- Category list -->
      <div class="panel" style="flex:1">
        <div class="panel-header">
          <span><i class="bi bi-tags me-2"></i>All Categories</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Category Name</th><th style="width:100px">Actions</th></tr>
            </thead>
            <tbody id="cats-tbody">
              <tr><td colspan="2"><div class="empty-state"><i class="bi bi-hourglass-split"></i><p>Loading…</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { injectSidebar } from '../js/sidebar.js';
  import '../js/logout.js';
  import { getUser } from '../js/auth.js';
  injectSidebar();
  if (getUser()?.role === 'admin') {
    document.getElementById('add-cat-panel').style.display = 'block';
  }
</script>
<script type="module" src="../js/categories.js"></script>
</body>
</html>
