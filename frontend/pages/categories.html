<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — Docket</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="categories">
  <div id="app" class="d-flex">

    <main class="main-content flex-grow-1">
      <div class="topbar">
        <h1>Categories</h1>
      </div>

      <div class="row g-4">
        <!-- Add category (admin only) -->
        <div class="col-lg-4 admin-only d-none">
          <div class="bg-white rounded-3 shadow-sm p-4">
            <h6 class="fw-semibold mb-3">Add New Category</h6>
            <form id="add-category-form">
              <div class="mb-3">
                <label class="form-label small">Category Name</label>
                <input id="category-name" type="text" class="form-control" placeholder="e.g. Finance" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-plus-lg me-1"></i>Add Category
              </button>
            </form>
          </div>
        </div>

        <!-- Category list -->
        <div class="col-lg-8">
          <div class="doc-table-wrapper">
            <div class="p-3 border-bottom fw-semibold">All Categories</div>
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr><th>Category Name</th><th style="width:100px">Actions</th></tr>
              </thead>
              <tbody id="cats-tbody">
                <tr><td colspan="2" class="text-center text-muted py-4">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { injectSidebar } from '../js/sidebar.js';
    import '../js/logout.js';
    injectSidebar();
  </script>
  <script type="module" src="../js/categories.js"></script>
</body>
</html>
